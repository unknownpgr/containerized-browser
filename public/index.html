<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>containerized-browser · live</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #e5e5e5;          /* letterbox around the page frame */
    --surface: #ffffff;
    --panel: rgba(255, 255, 255, .86);
    --border: #e0e0e0;
    --border-strong: #c8c8c8;
    --text: #171717;
    --muted: #737373;
    --pressed: rgba(0, 0, 0, .07);
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, .1);
    --ok: #16a34a;
    --bad: #dc2626;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 20px rgba(0, 0, 0, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f;
      --surface: #1c1c1c;
      --panel: rgba(32, 32, 32, .86);
      --border: #333333;
      --border-strong: #4a4a4a;
      --text: #ededed;
      --muted: #a3a3a3;
      --pressed: rgba(255, 255, 255, .1);
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, .16);
      --ok: #22c55e;
      --bad: #ef4444;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans CJK KR", sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  [hidden] { display: none !important; }

  /* the page owns the whole window */
  main { position: fixed; inset: 0; }
  #single { position: absolute; inset: 0; display: grid; place-items: center; }
  /* top-aligned, so any letterbox collects at the bottom, under the panel */
  #screen { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center top; }
  .empty { color: var(--muted); }

  #grid { position: absolute; inset: 0; overflow: auto; display: grid; gap: 8px; align-content: start;
    padding: 8px 8px 64px; /* bottom room so the last row can scroll clear of the panel */
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
  .tile { display: flex; flex-direction: column; text-align: left; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  .tile:hover { border-color: var(--border-strong); }
  .tile.agent { border-color: var(--accent); }
  .tile .cap { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; font-size: 12px;
    white-space: nowrap; }
  /* fixed-ratio thumbnails keep every row even; frames of another shape letterbox */
  .tile .shot { display: grid; place-items: center; aspect-ratio: 16 / 9; background: var(--bg); }
  .tile img { display: block; width: 100%; height: 100%; object-fit: contain; }

  /* floating panel: bottom centre, fades out while the pointer is idle */
  #panel { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 1;
    width: max-content; max-width: calc(100% - 24px); margin: 0 auto; /* centred, shrinks to fit */
    display: flex; align-items: center; gap: 4px; height: 40px; padding: 4px;
    background: var(--panel); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    white-space: nowrap; transition: opacity .25s, transform .25s; }
  #panel.idle { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .sep { flex: none; width: 1px; height: 18px; margin: 0 4px; background: var(--border); }

  nav { flex: 0 1 auto; min-width: 0; height: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav:empty, nav:empty + .sep { display: none; }
  .tab { flex: 0 1 auto; min-width: 64px; max-width: 200px; height: 100%; display: flex; align-items: center;
    gap: 6px; padding: 0 10px; border-radius: 6px; color: var(--muted); }
  .tab:hover { color: var(--text); }
  .tab.viewing { color: var(--text); background: var(--pressed); }
  .label { overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: none; padding: 0 5px; border-radius: 4px; font-size: 11px; line-height: 17px;
    font-weight: 500; color: var(--accent); background: var(--accent-soft); }
  /* when space runs out the URL gives way first (huge shrink factor), then the tabs */
  #url { flex: 0 1000 auto; min-width: 0; max-width: 320px; padding: 0 6px; color: var(--muted); font-size: 12px; }
  #url span { display: block; overflow: hidden; text-overflow: ellipsis; }
  #url:has(span:empty) { display: none; }
  #url.stub span { visibility: hidden; } /* a stub like "ht…" says nothing */

  .mode { flex: none; display: flex; gap: 2px; height: 100%; }
  .mode button { padding: 0 10px; border-radius: 6px; color: var(--muted); font-size: 12px; }
  .mode button:hover { color: var(--text); }
  .mode button[aria-pressed="true"] { background: var(--pressed); color: var(--text); }
  .status { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px;
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  .dot.down { background: var(--bad); }
  #state { min-width: 3.4em; }
  .ver { color: var(--muted); }
  .ver:empty { display: none; }
</style>
</head>
<body>
  <main>
    <div id="single">
      <img id="screen" alt="live view of the selected tab" hidden />
      <div class="empty" id="empty">Waiting for first frame…</div>
    </div>
    <div id="grid" hidden></div>
  </main>
  <div id="panel">
    <nav id="tabs" aria-label="open tabs"></nav>
    <span class="sep"></span>
    <div id="url"><span id="urltext"></span></div>
    <div class="mode" role="group" aria-label="view mode">
      <button id="follow" aria-pressed="true" title="Always show the tab the agent is driving">Follow agent</button>
      <button id="all" aria-pressed="false" title="Watch every open tab at once">All tabs</button>
    </div>
    <span class="sep"></span>
    <span class="status" title="connection to the container · frames per second">
      <span class="dot" id="dot"></span>
      <span id="state">Connecting…</span>
      <span class="ver" id="ver" title="running release"></span>
    </span>
  </div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const dot = $('dot'), stateEl = $('state');
  const followBtn = $('follow'), allBtn = $('all');
  const tabsEl = $('tabs'), urlEl = $('urltext');
  const single = $('single'), img = $('screen'), empty = $('empty'), grid = $('grid');

  // Read-only: choosing a tab here only changes what THIS viewer watches; it never
  // touches the agent's `page`.
  let tabs = [];             // [{ id, title, url }] from the hub, in open order
  let agent = null;          // tab id the agent's `page` points at
  let mode = 'follow';       // 'follow' | 'pin' | 'all'
  let pinned = null;         // tab id when mode === 'pin'
  const frames = new Map();  // tab id -> latest frame (data URL)
  const tiles = new Map();   // tab id -> grid tile elements
  let ws = null;

  let live = false, count = 0; // while live the status shows frames per second
  setInterval(() => { if (live) stateEl.textContent = count + ' fps'; count = 0; }, 1000);

  // The panel floats over the page, so it gets out of the way: it fades after a
  // few idle seconds and comes back on any pointer/key activity. It never hides
  // while hovered/focused or while the connection is down.
  const panel = $('panel');
  let idleTimer = 0;
  function wake() {
    panel.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (live && !panel.matches(':hover, :focus-within')) panel.classList.add('idle');
      else wake();
    }, 2500);
  }
  for (const ev of ['pointermove', 'pointerdown', 'keydown']) addEventListener(ev, wake, { passive: true });

  // visibility (not display) so hiding the stub can't change the layout it reacts to
  const urlBox = $('url');
  new ResizeObserver(() => urlBox.classList.toggle('stub', urlBox.clientWidth < 90)).observe(urlBox);

  const label = (t) => t.title || t.url || 'about:blank';
  const shownId = () => mode === 'pin' ? pinned
    : mode === 'follow' ? (agent ?? (tabs.length ? tabs[tabs.length - 1].id : null))
    : null;

  function sendWatch() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const msg = mode === 'all' ? { all: true } : mode === 'pin' ? { ids: [pinned] } : { follow: true };
    ws.send(JSON.stringify({ type: 'watch', ...msg }));
  }

  function setMode(m, id = null) {
    mode = m; pinned = id;
    sendWatch();
    render();
  }

  function badge() {
    const b = document.createElement('span');
    b.className = 'badge'; b.textContent = 'Agent';
    b.title = 'the tab the agent is driving';
    return b;
  }

  function showFrame(id) {
    const src = frames.get(id);
    if (src) { img.src = src; img.hidden = false; empty.hidden = true; }
    else { img.hidden = true; empty.hidden = false; empty.textContent = id ? 'Waiting for first frame…' : 'No open tabs'; }
  }

  function renderTabs() {
    const viewing = shownId();
    tabsEl.replaceChildren(...tabs.map((t) => {
      const b = document.createElement('button');
      b.className = 'tab' + (t.id === viewing ? ' viewing' : '');
      b.title = t.url + (t.id === agent ? '\n(agent is driving this tab)' : '') + '\nclick to pin this tab';
      const l = document.createElement('span');
      l.className = 'label'; l.textContent = label(t);
      b.append(l);
      if (t.id === agent) b.append(badge());
      b.onclick = () => setMode('pin', t.id);
      return b;
    }));
  }

  function renderGrid() {
    for (const [id, el] of tiles) if (!tabs.some((t) => t.id === id)) { el.root.remove(); tiles.delete(id); }
    for (const t of tabs) {
      let el = tiles.get(t.id);
      if (!el) {
        const root = document.createElement('button');
        root.className = 'tile';
        root.onclick = () => setMode('pin', t.id);
        const cap = document.createElement('div'); cap.className = 'cap';
        const l = document.createElement('span'); l.className = 'label';
        const shot = document.createElement('div'); shot.className = 'shot';
        const im = document.createElement('img'); im.alt = '';
        const wait = document.createElement('span'); wait.className = 'empty'; wait.textContent = 'Waiting…';
        cap.append(l); shot.append(im, wait); root.append(cap, shot);
        el = { root, cap, label: l, shot, img: im, wait };
        tiles.set(t.id, el);
      }
      el.label.textContent = label(t);
      el.root.title = t.url + '\nclick to watch only this tab';
      el.root.classList.toggle('agent', t.id === agent);
      const hasBadge = el.cap.querySelector('.badge');
      if (t.id === agent && !hasBadge) el.cap.append(badge());
      if (t.id !== agent && hasBadge) hasBadge.remove();
      const src = frames.get(t.id);
      el.img.hidden = !src; el.wait.hidden = !!src;
      if (src && el.img.src !== src) el.img.src = src;
      grid.append(el.root); // keeps tile order == tab order
    }
  }

  function render() {
    followBtn.setAttribute('aria-pressed', String(mode === 'follow'));
    allBtn.setAttribute('aria-pressed', String(mode === 'all'));
    renderTabs();
    single.hidden = mode === 'all';
    grid.hidden = mode !== 'all';
    if (mode === 'all') { urlEl.textContent = ''; renderGrid(); return; }
    const id = shownId();
    const t = tabs.find((x) => x.id === id);
    urlEl.textContent = t ? t.url : '';
    showFrame(id);
  }

  function onTabs(msg) {
    tabs = msg.tabs; agent = msg.agent;
    const ids = new Set(tabs.map((t) => t.id));
    for (const id of frames.keys()) if (!ids.has(id)) frames.delete(id);
    if (mode === 'pin' && !ids.has(pinned)) { setMode('follow'); return; } // pinned tab closed
    render();
  }

  function onFrame(msg) {
    count++;
    const src = 'data:image/jpeg;base64,' + msg.data;
    frames.set(msg.id, src);
    if (mode === 'all') {
      const el = tiles.get(msg.id);
      if (el) { el.img.src = src; el.img.hidden = false; el.wait.hidden = true; }
    } else if (msg.id === shownId()) {
      img.src = src;
      if (img.hidden) { img.hidden = false; empty.hidden = true; }
    }
  }

  followBtn.onclick = () => setMode('follow');
  allBtn.onclick = () => setMode(mode === 'all' ? 'follow' : 'all');

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/stream`);
    ws.onopen = () => {
      live = true; dot.className = 'dot live'; stateEl.textContent = 'Live';
      if (mode !== 'follow') sendWatch(); // the hub starts every viewer in follow mode
    };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'frame') onFrame(msg);
      else if (msg.type === 'tabs') onTabs(msg);
    };
    const drop = () => {
      live = false; dot.className = 'dot down'; wake();
      stateEl.textContent = 'Reconnecting…';
      // Signed out (e.g. the container restarted with a new password)? Then
      // retrying is pointless; reload, which lands on the login page.
      fetch('/version').then((r) => { if (r.status === 401) location.reload(); }).catch(() => {});
      setTimeout(connect, 1000);
    };
    ws.onclose = drop;
    ws.onerror = () => ws.close();
  }
  // which release this container is (vN, or `dev` for an unreleased build)
  fetch('/version').then((r) => (r.ok ? r.json() : null))
    .then((j) => { if (j) $('ver').textContent = j.version; }).catch(() => {});

  render();
  connect();
  wake();
})();
</script>
</body>
</html>
